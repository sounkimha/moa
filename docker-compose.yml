services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moa
      POSTGRES_USER: moa
      POSTGRES_PASSWORD: moa_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - moa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moa -d moa"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - moa_redis:/data
volumes:
  moa_pg:
  moa_redis:
